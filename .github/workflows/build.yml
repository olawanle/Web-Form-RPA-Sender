name: Build Desktop Apps

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-matrix:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-13, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
      - name: Build
        run: |
          pyinstaller pyinstaller.spec --clean --noconfirm
      - name: Build Windows installer (Inno Setup)
        if: matrix.os == 'windows-latest'
        uses: Minionguyjpro/Inno-Setup-Action@v1.2.4
        with:
          path: installer/windows/WebFormRPA.iss
      - name: Upload macOS artifact (dist folder)
        if: matrix.os == 'macos-13'
        uses: actions/upload-artifact@v4
        with:
          name: WebFormRPA-macos
          path: dist/**
          if-no-files-found: error

      - name: Upload Windows artifacts (dist + installer Output)
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: WebFormRPA-windows
          path: |
            dist/**
            Output/**
          if-no-files-found: warn
